<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Buchtanen iRacer Overlay</title>
  <link rel="stylesheet" href="/overlay/static/css/overlay.css">
  <link id="theme-css" rel="stylesheet" href="/overlay/static/css/themes/cyber_racing.css">
</head>
<body>
  <div id="session-layer"></div>
  <div id="bio-expanded"></div>
  <div id="event-layer"></div>
  <div id="battle-stack"></div>
  <div id="bio-compact">
    <span class="heart-pulse">♥</span>
    <span id="bio-bpm">—</span>
    <span id="ble-dot" class="ble-dot" title="BLE"></span>
  </div>
  <div id="sysinfo-widget">
    <div class="sys-brand">BUCHTANEN iRACER</div>
    <div class="sys-mod" id="cpu-load"><div class="label">CPU</div><div class="value">—</div></div>
    <div class="sys-mod" id="cpu-temp"><div class="label">CPU TEMP</div><div class="value">—</div></div>
    <div class="sys-mod" id="cpu-pwr"><div class="label">CPU PWR</div><div class="value">—</div></div>
    <div class="sys-mod" id="cpu-freq"><div class="label">CPU FREQ</div><div class="value">—</div></div>
    <div class="sys-mod" id="gpu-load"><div class="label">GPU</div><div class="value">—</div></div>
    <div class="sys-mod" id="gpu-temp"><div class="label">GPU TEMP</div><div class="value">—</div></div>
    <div class="sys-mod" id="gpu-pwr"><div class="label">GPU PWR</div><div class="value">—</div></div>
    <div class="sys-mod" id="gpu-clk"><div class="label">GPU CLK</div><div class="value">—</div></div>
    <div class="sys-mod" id="vram"><div class="label">VRAM</div><div class="value">—</div></div>
    <div class="sys-mod" id="ram"><div class="label">RAM</div><div class="value">—</div></div>
    <div class="sys-mod" id="fps"><div class="label">FPS</div><div class="value">—</div></div>
    <div class="sys-mod" id="ft"><div class="label">FT</div><div class="value">—</div></div>
    <div class="sys-mod" id="hr"><div class="label">HR</div><div class="value">♥ —</div></div>
  </div>
  <script type="module" src="/overlay/static/js/overlay.js"></script>
</body>
</html>
