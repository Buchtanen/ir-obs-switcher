<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Buchtanen iRacer Overlay</title>
  <link rel="stylesheet" href="/overlay/static/css/overlay.css">
  <link id="theme-css" rel="stylesheet" href="/overlay/static/css/themes/cyber_racing.css">
  <script>
    const params = new URLSearchParams(location.search);
    if (params.has("demo")) document.documentElement.classList.add("is-demo");
    if (params.get("layout") === "preview" || params.get("layout") === "golden") {
      document.documentElement.classList.add("preview-layout");
    }
  </script>
</head>
<body>
  <div id="session-layer"></div>
  <div id="bio-expanded"></div>
  <div id="event-layer"></div>
  <div id="battle-stack"></div>
  <div id="bio-compact">
    <div class="layer plate" data-slot="bio_compact_plate"></div>
    <div class="layer glow" data-slot="battle_glow_cyan"></div>
    <span class="icon mask heart-pulse" data-slot="heart_icon"></span>
    <span id="bio-bpm">—</span>
    <span id="ble-dot" class="icon mask ble-icon" data-slot="ble_icon" title="BLE"></span>
  </div>
  <div id="sysinfo-widget">
    <div class="sysinfo-art">
      <div class="layer bg" data-slot="sysinfo_background"></div>
      <div class="layer dividers mask cover" data-slot="sysinfo_dividers"></div>
    </div>
    <div class="sys-brand">BUCHTANEN iRACER</div>
    <div class="sys-mod" id="cpu-load"><span class="sys-icon icon mask" data-slot="cpu_icon"></span><div class="sys-copy"><div class="label">CPU</div><div class="value">—</div></div></div>
    <div class="sys-mod" id="cpu-temp"><span class="sys-icon icon mask" data-slot="temp_icon"></span><div class="sys-copy"><div class="label">CPU TEMP</div><div class="value">—</div></div></div>
    <div class="sys-mod" id="cpu-pwr"><span class="sys-icon icon mask" data-slot="power_icon"></span><div class="sys-copy"><div class="label">CPU PWR</div><div class="value">—</div></div></div>
    <div class="sys-mod" id="gpu-load"><span class="sys-icon icon mask" data-slot="gpu_icon"></span><div class="sys-copy"><div class="label">GPU</div><div class="value">—</div></div></div>
    <div class="sys-mod" id="gpu-temp"><span class="sys-icon icon mask" data-slot="temp_icon"></span><div class="sys-copy"><div class="label">GPU TEMP</div><div class="value">—</div></div></div>
    <div class="sys-mod" id="gpu-pwr"><span class="sys-icon icon mask" data-slot="power_icon"></span><div class="sys-copy"><div class="label">GPU PWR</div><div class="value">—</div></div></div>
    <div class="sys-mod" id="gpu-clk"><span class="sys-icon icon mask" data-slot="gpu_icon"></span><div class="sys-copy"><div class="label">GPU CLK</div><div class="value">—</div></div></div>
    <div class="sys-mod" id="vram"><span class="sys-icon icon mask" data-slot="ram_icon"></span><div class="sys-copy"><div class="label">VRAM</div><div class="value">—</div></div></div>
    <div class="sys-mod" id="ram"><span class="sys-icon icon mask" data-slot="ram_icon"></span><div class="sys-copy"><div class="label">RAM</div><div class="value">—</div></div></div>
    <div class="sys-mod" id="fps"><span class="sys-icon icon mask" data-slot="fps_icon"></span><div class="sys-copy"><div class="label">FPS</div><div class="value">—</div></div></div>
    <div class="sys-mod" id="hr"><span class="sys-icon icon mask" data-slot="heart_icon"></span><div class="sys-copy"><div class="label">HR</div><div class="value">—</div></div></div>
  </div>
  <script type="module" src="/overlay/static/js/overlay.js"></script>
</body>
</html>
