[app]
http_host = 127.0.0.1
http_port = 17321
log_level = INFO
notifications_enabled = true

[iracing]
poll_hz = 5
quit_stall_seconds = 0.4

[obs]
ws_url = ws://127.0.0.1:4455
password = your_password_here
# Optional: if set, switcher only works when this profile is active in OBS
# required_profile = MyProfile

[switching]
autoswitch_default = true
debounce_ms = 900
cooldown_ms = 1000
override_seconds = 120
safe_scene = Idle

[hotkeys]
# Hotkey for RESTART mode (optional) - hold this key combo when quitting iRacing
# Format: modifier+modifier+key (e.g. ctrl+shift+r, alt+r, ctrl+r)
# restart_hotkey = ctrl+shift+f7

[scenes]
IDLE = Idle
GARAGE = Pits
RACE = Race
REPLAY = Replay
QUIT = End
# RESTART = Restart  # Uncomment if using restart_hotkey