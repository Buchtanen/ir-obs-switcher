[app]
http_host = 127.0.0.1
http_port = 17321
log_level = INFO
notifications_enabled = true

[iracing]
poll_hz = 5
quit_stall_seconds = 0.4

[obs]
ws_url = ws://127.0.0.1:4455
password = your_password_here
# Optional: if set, switcher only works when this profile is active in OBS
# required_profile = MyProfile

[switching]
autoswitch_default = true
debounce_ms = 900
cooldown_ms = 1000
override_seconds = 120
safe_scene = Idle

# Automatické spuštění broadcastu během loadingu
auto_start_broadcast = false  # Povolit automatické spuštění
auto_start_at_percent = 50    # Spustit v X% průměrného loadingu (0-100)
default_loading_time_seconds = 12.0  # Výchozí čas loadingu, pokud nemáme historii (použije se při prvním spuštění)

# Automatické zastavení streamu po QUIT
auto_stop_stream = false      # Povolit automatické zastavení
stop_stream_after_seconds = 30  # Zastavit stream X sekund po QUIT

[hotkeys]
# Hotkey for RESTART mode (optional) - hold this key combo when quitting iRacing
# Format: modifier+modifier+key (e.g. ctrl+shift+r, alt+r, ctrl+r)
# restart_hotkey = ctrl+shift+f7

[scenes]
IDLE = Idle
GARAGE = Pits
RACE = Race
REPLAY = Replay
QUIT = End
# RESTART = Restart  # Uncomment if using restart_hotkey

[dashboards]
# Update rate pro HTML dashboardy
dashboard_update_fps = 2  # FPS pro autoupdate (výchozí 2 = 500ms interval)

# Cesty k obrázkům pro velký dashboard (gr-status) - volitelné
# dashboard_gr_background_image = path/to/background.png
# dashboard_gr_logo_obs = path/to/obs_logo.png
# dashboard_gr_logo_iracing = path/to/iracing_logo.png
# dashboard_gr_logo_app = path/to/app_logo.png

# Cesta k ikonám pro VR dashboard (vr-status) - volitelné
# dashboard_vr_icons_path = path/to/vr_icons/

# Velikost event logu pro gr-status
dashboard_event_log_size = 50  # Počet posledních eventů v logu