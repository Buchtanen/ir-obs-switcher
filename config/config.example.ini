[app]
http_host = 127.0.0.1
http_port = 17321
log_level = INFO
notifications_enabled = true
# Optional: log to file with rotation
# log_file = logs/irswitch.log
# log_max_bytes = 10485760  # 10 MB default
# log_backup_count = 5  # Keep 5 backup files
# Optional: enable colored console output (default: true)
# log_colors = true

[iracing]
poll_hz = 5
quit_stall_seconds = 0.4

[obs]
ws_url = ws://127.0.0.1:4455
password = your_password_here
# Optional: if set, switcher only works when this profile is active in OBS
# required_profile = MyProfile

[switching]
autoswitch_default = true
debounce_ms = 900
cooldown_ms = 1000
override_seconds = 120
safe_scene = Idle

# Automatické spuštění broadcastu během loadingu
auto_start_broadcast = false  # Povolit automatické spuštění
auto_start_at_percent = 50    # Spustit v X% průměrného loadingu (0-100)
default_loading_time_seconds = 12.0  # Výchozí čas loadingu, pokud nemáme historii (použije se při prvním spuštění)

# Automatické zastavení streamu po QUIT
auto_stop_stream = false      # Povolit automatické zastavení
stop_stream_after_seconds = 30  # Zastavit stream X sekund po QUIT

[hotkeys]
# Hotkey for RESTART mode (optional) - hold this key combo when quitting iRacing
# Format: modifier+modifier+key (e.g. ctrl+shift+r, alt+r, ctrl+r)
# restart_hotkey = ctrl+shift+f7

[scenes]
IDLE = Idle
GARAGE = Pits
RACE = Race
REPLAY = Replay
QUIT = End
# RESTART = Restart  # Uncomment if using restart_hotkey

[dashboards]
# Update rate pro HTML dashboardy
dashboard_update_fps = 2  # FPS pro autoupdate (výchozí 2 = 500ms interval)

# Cesty k obrázkům pro velký dashboard (gr-status) - volitelné
# dashboard_gr_background_image = path/to/background.png
# dashboard_gr_logo_obs = path/to/obs_logo.png
# dashboard_gr_logo_iracing = path/to/iracing_logo.png
# dashboard_gr_logo_app = path/to/app_logo.png

# Cesta k ikonám pro VR dashboard (vr-status) - volitelné
# dashboard_vr_icons_path = path/to/vr_icons/

# Velikost event logu pro gr-status
dashboard_event_log_size = 50  # Počet posledních eventů v logu

[oauth]
# Optional: OAuth credentials for YouTube API
# If not set, will try to use environment variables GOOGLE_OAUTH_CLIENT_ID and GOOGLE_OAUTH_CLIENT_SECRET
# Get these from Google Cloud Console: https://console.cloud.google.com/apis/credentials
# See YOUTUBE_API_SETUP.md for detailed instructions
# client_id = your_client_id_here.apps.googleusercontent.com
# client_secret = GOCSPX-your_client_secret_here

# --- Overlay / race pipeline (all optional; defaults apply if omitted) ---
[overlay]
enabled = true
theme = cyber_racing
debug = false
# Overlay copy language: en (base catalog) or cs. Missing translations fall
# back to English. Independent of [app] language, which drives the dashboards.
language = en
# Overlay V4 rollout flags. Full V4 demo profile: assets + renderer on.
v4_assets = true
v4_renderer = true

# Event-engine rollout flags. Full V4 demo profile: all story widgets on.
[event_engine]
v2_payload = true
practice = true
quali_projection = true
overtake_classifier = true
pit_story = true
hr_pressure = true

[sampling]
default_hz = 5

# Optional overrides. Omit to use default_hz. bio hz 0 = BLE notifications (push).
# [sampling.race]
# hz = 10
# [sampling.system]
# hz = 2
# [sampling.bio]
# hz = 0

[battle.hunting]
enter_gap = 3.0
exit_gap = 4.0
min_closing_rate = 0.10
activation_delay = 2.0
exit_delay = 1.5
approach_enter_gap = 1.5
approach_exit_gap = 1.8
attack_enter_gap = 0.8
attack_exit_gap = 1.0
side_by_side_enter_gap = 0.35
side_by_side_exit_gap = 0.45
intensity_min_closing_rate = 0.15

[battle.hunted]
enter_gap = 3.0
exit_gap = 4.0
min_closing_rate = 0.10
activation_delay = 2.0
exit_delay = 1.5

[battle]
position_stable_seconds = 1.0
gap_history_seconds = 3.0

[battle.overtake]
max_gap = 2.5
min_closing_rate = 0.08

[heart_rate]
enabled = true
source = bluetooth
baseline_window = 300
calm_delta = 5
focused_delta = 15
pushing_delta = 25

[heart_rate.bluetooth]
# auto = advertised Heart Rate service (0x180D). Pin a name/address if several HR sensors.
# Windows: bond happens on connect (Bleak pair), not via Settings-only scan.
device = auto
reconnect = true

[system_info]
enabled = true
# LibreHardwareMonitor 0.9.5+ dropped WMI. Overlay reads
# http://127.0.0.1:8085/data.json (Options → Remote Web Server → Run,
# File → Hardware → CPU). LAN bind is picked up from LibreHardwareMonitor.config.
# Optional in-process LHM DLL (pythonnet extra sysinfo-lhm); not auto-discovered.
# lhm_dll_path =
cpu_temp_warn = 80
cpu_temp_crit = 95
gpu_temp_warn = 80
gpu_temp_crit = 90

[system_info.cpu]
enabled = true

[system_info.gpu]
enabled = true

[system_info.memory]
enabled = true

[events]
incident_min_delta = 2
lap_duration = 4.0
lap_cooldown = 5.0
system_events_on_overlay = false

[events.priorities]
hunting = 20
hunted = 20
lap_complete = 40
personal_best = 60
position_change = 70
incident = 90
final_lap = 95
finish = 100
