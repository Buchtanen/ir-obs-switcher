<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><title>Pitwall widget composition example</title><link rel="stylesheet" href="../css/pitwall-race-control.css"></head>
<body style="margin:0;background:transparent">
<article class="pw-widget" data-event="HUNTING" data-state="active" data-phase="active" aria-label="Hunting event">
  <img class="pw-layer pw-layer--base" src="../../assets/vector/templates/hunting/pw-hunting-01-plate-base.svg" alt="">
  <img class="pw-layer pw-layer--surface" src="../../assets/vector/templates/hunting/pw-hunting-02-data-surface.svg" alt="">
  <img class="pw-layer pw-layer--grid" src="../../assets/vector/templates/hunting/pw-hunting-06-technical-grid.svg" alt="">
  <img class="pw-layer pw-layer--ticks" src="../../assets/vector/templates/hunting/pw-hunting-05-timing-ticks.svg" alt="">
  <img class="pw-layer pw-layer--border" src="../../assets/vector/templates/hunting/pw-hunting-03-border.svg" alt="">
  <span class="pw-layer pw-layer--rail" aria-hidden="true"></span>
  <div class="pw-content">
    <span class="pw-icon"><svg aria-hidden="true"><use href="../../assets/vector/icons/pw-icons-sprite.svg#pw-target"></use></svg></span>
    <span class="pw-label">Battle channel</span><strong class="pw-title">Hunting</strong>
    <span class="pw-meta">P6 · Driver name</span><strong class="pw-value">+0.472</strong>
  </div>
</article>
</body></html>
