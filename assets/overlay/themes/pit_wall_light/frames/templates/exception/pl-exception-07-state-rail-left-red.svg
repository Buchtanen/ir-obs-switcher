<svg xmlns="http://www.w3.org/2000/svg" width="420" height="140" viewBox="0 0 420 140" fill="none">
  <title>PITWALL LIGHT red exception state rail left</title>
  <defs>
    <linearGradient id="glass" x1="36" y1="0" x2="386" y2="140" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".84"/><stop offset="1" stop-color="#E9F3FF" stop-opacity=".62"/>
    </linearGradient>
    <linearGradient id="surface" x1="70" y1="18" x2="390" y2="122" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".56"/><stop offset="1" stop-color="#DDEBFA" stop-opacity=".34"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-45%" width="140%" height="190%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0B1E3A" flood-opacity=".20"/>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect x="1" y="1" width="418" height="138" rx="25"/></clipPath>
</defs>
  <rect x="0" y="17" width="7" height="106" rx="3.5" fill="#E84C56"/>
  <rect x="2" y="29" width="3" height="82" rx="1.5" fill="#FFFFFF" fill-opacity=".36" filter="url(#softGlow)"/>

</svg>
