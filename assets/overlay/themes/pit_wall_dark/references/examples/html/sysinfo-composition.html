<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><title>Pitwall sysinfo composition example</title><link rel="stylesheet" href="../css/pitwall-race-control.css"></head>
<body style="margin:0;background:transparent">
<section class="pw-sysinfo" aria-label="System information">
  <img class="pw-sysinfo__layer" src="../../assets/vector/sysinfo/pw-sysinfo-base.svg" alt="">
  <img class="pw-sysinfo__layer" src="../../assets/vector/sysinfo/pw-sysinfo-bus-line.svg" alt="">
  <img class="pw-sysinfo__layer" src="../../assets/vector/sysinfo/pw-sysinfo-ticks.svg" alt="">
  <img class="pw-sysinfo__layer" src="../../assets/vector/sysinfo/pw-sysinfo-dividers.svg" alt="">
  <div class="pw-sysinfo__data">
    <div class="pw-channel"><div class="pw-channel__id">CPU LOAD</div><div class="pw-channel__value">24%</div></div>
    <div class="pw-channel"><div class="pw-channel__id">CPU TEMP</div><div class="pw-channel__value">56°</div></div>
    <div class="pw-channel"><div class="pw-channel__id">CPU POWER</div><div class="pw-channel__value">48W</div></div>
    <div class="pw-channel"><div class="pw-channel__id">GPU LOAD</div><div class="pw-channel__value">62%</div></div>
    <div class="pw-channel"><div class="pw-channel__id">GPU TEMP</div><div class="pw-channel__value">63°</div></div>
    <div class="pw-channel"><div class="pw-channel__id">MEMORY</div><div class="pw-channel__value">12.6G</div></div>
    <div class="pw-channel"><div class="pw-channel__id">FPS</div><div class="pw-channel__value">144</div></div>
    <div class="pw-channel"><div class="pw-channel__id">FRAME TIME</div><div class="pw-channel__value">6.9ms</div></div>
    <div class="pw-channel"><div class="pw-channel__id">HR / BLE</div><div class="pw-channel__value">128</div></div>
  </div>
</section>
</body></html>
