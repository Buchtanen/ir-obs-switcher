name: Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip setuptools wheel build

    - name: Install package in editable mode
      run: |
        pip install -e .
      env:
        PYTHONPATH: ${{ github.workspace }}/src

    - name: Install test dependencies
      run: |
        pip install pytest pytest-asyncio freezegun

    - name: Verify installation
      run: |
        python -c "import sys; print('Python path:', sys.path)"
        python -c "import irswitch; print(f'OK: irswitch version: {irswitch.__version__}')"
        python -c "from irswitch.obs.client import ObsClient; print('OK: OBS client import')"
        python -c "from irswitch.iracing.reader import IRacingReader; print('OK: iRacing reader import')"
        python -c "from irswitch.logic.state_machine import StateMachine; print('OK: State machine import')"
        python -c "from irswitch.server.metrics import MetricsCollector; print('OK: Metrics import')"
      env:
        PYTHONPATH: ${{ github.workspace }}/src

    - name: Run tests
      run: |
        pytest -v --tb=short
      env:
        PYTHONPATH: ${{ github.workspace }}/src

    - name: Check code formatting (optional)
      run: |
        pip install black
        black --check src/ tests/ || true
      env:
        NO_COLOR: 1

  build:
    runs-on: windows-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip setuptools wheel build

    - name: Install package
      run: |
        pip install -e .
      env:
        PYTHONPATH: ${{ github.workspace }}/src

    - name: Install PyInstaller
      run: |
        pip install pyinstaller

    - name: Build distribution
      run: |
        .\build_exe.ps1 --all
      shell: pwsh

    - name: Create distribution archive
      run: |
        $version = python -c "import irswitch; print(irswitch.__version__)"
        $commitHash = "${{ github.sha }}".Substring(0, 7)
        $buildDate = Get-Date -Format "yyyy-MM-dd"
        $archiveName = "irswitch-v$version-windows.zip"
        
        # Create build info file
        $buildInfo = "iRacing OBS Switcher - Build Information`n"
        $buildInfo += "=========================================`n"
        $buildInfo += "Version: $version`n"
        $buildInfo += "Commit: $commitHash`n"
        $buildInfo += "Build Date: $buildDate`n"
        $buildInfo += "Branch: ${{ github.ref_name }}`n"
        $buildInfo | Out-File -FilePath "dist\BUILD_INFO.txt" -Encoding UTF8
        
        Compress-Archive -Path dist\* -DestinationPath $archiveName -Force
        echo "ARCHIVE_NAME=$archiveName" >> $env:GITHUB_ENV
        echo "VERSION=$version" >> $env:GITHUB_ENV

    - name: Upload distribution artifact
      uses: actions/upload-artifact@v4
      with:
        name: irswitch-distribution-${{ env.VERSION }}
        path: ${{ env.ARCHIVE_NAME }}
        retention-days: 30
