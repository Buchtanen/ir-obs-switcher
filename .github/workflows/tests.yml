name: Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip setuptools wheel build

    - name: Install package in editable mode
      run: |
        pip install -e .
      env:
        PYTHONPATH: ${{ github.workspace }}/src

    - name: Install test dependencies
      run: |
        pip install pytest pytest-asyncio freezegun

    - name: Verify installation
      run: |
        python -c "import sys; print('Python path:', sys.path)"
        python -c "import irswitch; print(f'✓ irswitch version: {irswitch.__version__}')"
        python -c "from irswitch.obs.client import ObsClient; print('✓ OBS client import OK')"
        python -c "from irswitch.iracing.reader import IRacingReader; print('✓ iRacing reader import OK')"
        python -c "from irswitch.logic.state_machine import StateMachine; print('✓ State machine import OK')"
        python -c "from irswitch.server.metrics import MetricsCollector; print('✓ Metrics import OK')"
      env:
        PYTHONPATH: ${{ github.workspace }}/src

    - name: Run tests
      run: |
        pytest -v --tb=short
      env:
        PYTHONPATH: ${{ github.workspace }}/src

    - name: Check code formatting (optional)
      run: |
        pip install black
        black --check src/ tests/ || true
