name: CI

on:
  push:
    branches: [ master, "codex/**", "feat/**", "feature/**", "fix/**", "chore/**", "ci/**" ]
  pull_request:
    branches: [ master ]

jobs:
  v2-contracts:
    name: v2 frozen contracts
    if: github.ref == 'refs/heads/codex/commentary-story-flow-spec' || github.head_ref == 'codex/commentary-story-flow-spec'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade "pip" "setuptools>=78.1.1" "wheel"
          pip install -e .

      - name: Check v2 frozen contracts when present
        shell: pwsh
        run: |
          $machine = "docs/v2.0.0/machine"
          if (-not (Test-Path $machine)) {
            Write-Host "v2 branch-only freeze artifacts are absent; nothing to check."
            exit 0
          }

          $builders = @(
            "build_freeze_registry.py",
            "build_dto_schemas.py",
            "build_beat_catalog.py",
            "build_successor_graph.py",
            "build_config_contract.py",
            "build_api_contracts.py",
            "build_actor_transition_model.py",
            "build_detector_catalog.py",
            "build_catalog_loader_contract.py",
            "build_realization_contract.py",
            "build_vertical_slice_fixtures.py"
          )

          foreach ($builder in $builders) {
            python "$machine/$builder"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

  lint:
    name: Lint (ruff)
    uses: ./.github/workflows/lint.yml
    with:
      python_version: "3.11"
      kind: ruff

  format:
    name: Format (black)
    uses: ./.github/workflows/lint.yml
    with:
      python_version: "3.11"
      kind: black

  type-check:
    name: Type Check (mypy)
    uses: ./.github/workflows/lint.yml
    with:
      python_version: "3.11"
      kind: mypy

  security-bandit:
    name: Security (Bandit)
    uses: ./.github/workflows/security.yml
    with:
      python_version: "3.11"
      kind: bandit

  security-safety:
    name: Security (Safety)
    uses: ./.github/workflows/security.yml
    with:
      python_version: "3.11"
      kind: safety
    secrets:
      SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}

  test:
    name: Tests
    needs: [lint, format, type-check]
    uses: ./.github/workflows/tests.yml
    with:
      # Explicit inputs to avoid accidental changes when defaults in tests.yml evolve.
      python_versions_json: "[\"3.11\",\"3.12\",\"3.13\"]"
      run_coverage: true
      coverage_python: "3.11"

  build-verify:
    name: Build Verification
    needs: [test, security-bandit, security-safety]
    if: >
      github.event_name == 'push' &&
      (
        github.ref == 'refs/heads/master' ||
        startsWith(github.ref, 'refs/heads/feat/') ||
        startsWith(github.ref, 'refs/heads/feature/') ||
        startsWith(github.ref, 'refs/heads/fix/')
      )
    uses: ./.github/workflows/build.yml
    with:
      python_version: "3.11"
      mode: verify
