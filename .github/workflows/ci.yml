name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  lint:
    name: Lint (ruff)
    uses: ./.github/workflows/lint.yml
    with:
      python_version: "3.11"
      kind: ruff

  format:
    name: Format (black)
    uses: ./.github/workflows/lint.yml
    with:
      python_version: "3.11"
      kind: black

  type-check:
    name: Type Check (mypy)
    uses: ./.github/workflows/lint.yml
    with:
      python_version: "3.11"
      kind: mypy

  security-bandit:
    name: Security (Bandit)
    uses: ./.github/workflows/security.yml
    with:
      python_version: "3.11"
      kind: bandit

  security-safety:
    name: Security (Safety)
    uses: ./.github/workflows/security.yml
    with:
      python_version: "3.11"
      kind: safety
    secrets:
      SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}

  test:
    name: Tests
    needs: [lint, format, type-check]
    uses: ./.github/workflows/tests.yml

  build-verify:
    name: Build Verification
    needs: [test, security-bandit, security-safety]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    uses: ./.github/workflows/build.yml
    with:
      python_version: "3.11"
      mode: verify
