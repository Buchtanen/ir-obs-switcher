name: PR Policy (semver labels)

on:
  pull_request:
    types: [opened, edited, synchronize, labeled, unlabeled, reopened]
    branches: [ master ]

permissions:
  pull-requests: read
  issues: read
  contents: read

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  version-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: pyproject and release-please manifest lockstep
        run: python3 scripts/check_release_please_lock.py --github-event "$GITHUB_EVENT_PATH"

  semver-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enforce semver label policy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_semver_label.py --github-event "$GITHUB_EVENT_PATH"