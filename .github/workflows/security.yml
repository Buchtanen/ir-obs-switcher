name: Security Module

on:
  workflow_call:
    inputs:
      python_version:
        description: "Python version to use"
        required: false
        default: "3.11"
        type: string
      kind:
        description: "Which security check to run: bandit | safety"
        required: true
        type: string
    secrets:
      SAFETY_API_KEY:
        required: false
  schedule:
    # Run weekly on Monday at 10:00 UTC
    - cron: "0 10 * * 1"
  workflow_dispatch:
    inputs:
      python_version:
        description: "Python version to use"
        required: false
        default: "3.11"
        type: string
      kind:
        description: "Which security check to run"
        required: true
        type: choice
        options:
          - bandit
          - safety

jobs:
  run:
    name: ${{ inputs.kind }}
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ inputs.python_version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python_version }}
          cache: "pip"

      - name: Install base tooling
        run: |
          python -m pip install --upgrade "pip" "setuptools>=78.1.1" "wheel"

      - name: Install and run Bandit
        if: inputs.kind == 'bandit'
        run: |
          pip install bandit[toml]
          bandit -r src/ -c pyproject.toml --severity-level medium -f json -o bandit-report.json
        continue-on-error: false

      - name: Upload Bandit report
        if: inputs.kind == 'bandit'
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 7

      - name: Install and run Safety
        if: inputs.kind == 'safety'
        run: |
          pip install safety
          pip install -e .
          safety scan --output json
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}
        continue-on-error: false

  scheduled-bandit:
    name: bandit (scheduled)
    if: github.event_name == 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install and run Bandit
        run: |
          python -m pip install --upgrade "pip" "setuptools>=78.1.1" "wheel"
          pip install bandit[toml]
          bandit -r src/ -c pyproject.toml --severity-level medium -f json -o bandit-report.json

      - name: Upload Bandit report
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 7

  scheduled-safety:
    name: safety (scheduled)
    if: github.event_name == 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install and run Safety
        run: |
          python -m pip install --upgrade "pip" "setuptools>=78.1.1" "wheel"
          pip install safety
          pip install -e .
          safety scan --output json
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}
