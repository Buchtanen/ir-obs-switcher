name: Build Module

on:
  workflow_call:
    inputs:
      python_version:
        description: "Python version to use"
        required: false
        default: "3.11"
        type: string
      mode:
        description: "verify | distribution"
        required: true
        type: string
    outputs:
      archive_name:
        description: "Name of the distribution archive"
        value: ${{ jobs.export.outputs.archive_name }}
      version:
        description: "Version of the build"
        value: ${{ jobs.export.outputs.version }}
  workflow_dispatch:
    inputs:
      python_version:
        description: "Python version to use"
        required: false
        default: "3.11"
        type: string
      mode:
        description: "Build mode"
        required: true
        type: choice
        options:
          - verify
          - distribution

jobs:
  verify:
    name: Verify
    if: inputs.mode == 'verify'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ inputs.python_version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
          cache: "pip"

      - name: Install build tools
        run: |
          python -m pip install --upgrade "pip" "setuptools>=78.1.1" "wheel" "build"

      - name: Install package
        run: |
          pip install -e .
        env:
          PYTHONPATH: ${{ github.workspace }}/src

      - name: Install PyInstaller
        run: |
          pip install pyinstaller

      - name: Verify build (no artifact upload)
        run: |
          .\build_exe.ps1 --all
        shell: pwsh

      - name: Verify distribution files exist
        run: |
          if (-not (Test-Path "dist\irswitchd.exe")) {
            Write-Error "Build failed: irswitchd.exe not found"
            exit 1
          }
          Write-Host "✓ Build verification successful"
        shell: pwsh

  distribution:
    name: Distribution
    if: inputs.mode == 'distribution'
    runs-on: windows-latest
    outputs:
      archive_name: ${{ steps.archive.outputs.name }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ inputs.python_version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
          cache: "pip"

      - name: Install build tools
        run: |
          python -m pip install --upgrade "pip" "setuptools>=78.1.1" "wheel" "build"

      - name: Install package
        run: |
          pip install -e .
        env:
          PYTHONPATH: ${{ github.workspace }}/src

      - name: Install PyInstaller
        run: |
          pip install pyinstaller

      - name: Build distribution
        run: |
          .\build_exe.ps1 --all
        shell: pwsh

      - name: Extract version
        id: version
        run: |
          $version = python -c "import irswitch; print(irswitch.__version__)"
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "VERSION=$version" >> $env:GITHUB_ENV
          echo "Version: $version"

      - name: Create distribution archive
        id: archive
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $commitHash = "${{ github.sha }}".Substring(0, 7)
          $buildDate = Get-Date -Format "yyyy-MM-dd"
          $archiveName = "irswitch-v$version-windows.zip"

          # Create build info file
          $buildInfo = "iRacing OBS Switcher - Build Information`n"
          $buildInfo += "=========================================`n"
          $buildInfo += "Version: $version`n"
          $buildInfo += "Commit: $commitHash`n"
          $buildInfo += "Build Date: $buildDate`n"
          $buildInfo += "Ref: ${{ github.ref_name }}`n"
          $buildInfo | Out-File -FilePath "dist\BUILD_INFO.txt" -Encoding UTF8

          Compress-Archive -Path dist\* -DestinationPath $archiveName -Force
          echo "name=$archiveName" >> $env:GITHUB_OUTPUT
          echo "ARCHIVE_NAME=$archiveName" >> $env:GITHUB_ENV
          Write-Host "Created archive: $archiveName"

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: irswitch-distribution-${{ steps.version.outputs.version }}
          path: ${{ steps.archive.outputs.name }}
          retention-days: 30

  export:
    name: Export outputs
    needs: [verify, distribution]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    outputs:
      archive_name: >-
        ${{ needs.distribution.result == 'success' && needs.distribution.outputs.archive_name || '' }}
      version: >-
        ${{ needs.distribution.result == 'success' && needs.distribution.outputs.version || '' }}
    steps:
      - name: Export outputs (noop)
        run: |
          echo "archive_name=${{ needs.distribution.outputs.archive_name }}"
          echo "version=${{ needs.distribution.outputs.version }}"
