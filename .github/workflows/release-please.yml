name: Release Please

on:
  push:
    branches: [ master ]

# Serialize Release Please after burst merges onto master.
# cancel-in-progress: false — queue runs so a mid-flight cancel does not leave
# a half-updated orphan release-please branch without a PR.
concurrency:
  group: release-please-master
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Release Please (manifest)
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: master

      # skip-github-release skips RP tag push; release.yml builds on tag push.
      - name: Ensure release tag exists for current version
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG="v${VERSION}"
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release version ${VERSION}"
          git push origin "${TAG}"
          echo "Created and pushed ${TAG}"
