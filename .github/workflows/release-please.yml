name: Release Please

on:
  push:
    branches: [ master ]

# Serialize Release Please after burst merges onto master.
# cancel-in-progress: false — queue runs so a mid-flight cancel does not leave
# a half-updated orphan release-please branch without a PR.
concurrency:
  group: release-please-master
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Run Release Please (manifest)
        uses: googleapis/release-please-action@v4
        with:
          command: manifest
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          default-branch: master
